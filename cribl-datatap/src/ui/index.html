<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cribl DataTap</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0e17; color: #e0e6ed; min-height: 100vh; }
  .header { background: linear-gradient(135deg, #1a1f2e 0%, #0d1117 100%); border-bottom: 1px solid #2d3748; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 22px; font-weight: 600; }
  .header h1 span { color: #00d4aa; }
  .stats-bar { display: flex; gap: 24px; font-size: 13px; color: #8892a4; }
  .stats-bar .val { color: #00d4aa; font-weight: 600; font-variant-numeric: tabular-nums; }
  .main { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 60px); }
  .sidebar { background: #111827; border-right: 1px solid #2d3748; padding: 20px; overflow-y: auto; }
  .section { margin-bottom: 24px; }
  .section h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: #6b7280; margin-bottom: 10px; }
  .checks { display: flex; flex-direction: column; gap: 6px; }
  .checks label { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; padding: 6px 8px; border-radius: 6px; transition: background 0.15s; }
  .checks label:hover { background: #1f2937; }
  .checks input[type="checkbox"] { accent-color: #00d4aa; width: 16px; height: 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: #9ca3af; margin-bottom: 4px; }
  .field input, .field select { width: 100%; background: #1f2937; border: 1px solid #374151; color: #e5e7eb; padding: 8px 10px; border-radius: 6px; font-size: 14px; }
  .field input:focus, .field select:focus { outline: none; border-color: #00d4aa; }
  .range-row { display: flex; align-items: center; gap: 10px; }
  .range-row input[type="range"] { flex: 1; accent-color: #00d4aa; }
  .range-row .range-val { font-size: 14px; font-weight: 600; color: #00d4aa; min-width: 50px; text-align: right; }
  .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .btn-start { background: #00d4aa; color: #0a0e17; }
  .btn-start:hover { background: #00f0c0; }
  .btn-stop { background: #ef4444; color: white; }
  .btn-stop:hover { background: #f87171; }
  .btn-scenario { background: #6366f1; color: white; margin-top: 8px; }
  .btn-scenario:hover { background: #818cf8; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-group { display: flex; flex-direction: column; gap: 8px; }
  .feed { overflow-y: auto; padding: 0; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 12px; line-height: 1.6; }
  .event-row { padding: 6px 16px; border-bottom: 1px solid #1a1f2e; display: flex; gap: 12px; transition: background 0.1s; }
  .event-row:hover { background: #111827; }
  .event-num { color: #4b5563; min-width: 40px; text-align: right; flex-shrink: 0; }
  .event-st { font-weight: 600; min-width: 180px; flex-shrink: 0; }
  .event-raw { color: #9ca3af; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .event-row:hover .event-raw { white-space: normal; word-break: break-all; }
  .st-pan { color: #f59e0b; }
  .st-syslog { color: #3b82f6; }
  .st-win { color: #8b5cf6; }
  .st-cs { color: #ef4444; }
  .st-okta { color: #10b981; }
  .phase-row { padding: 10px 16px; background: #1e1b4b; color: #a5b4fc; font-weight: 600; border-bottom: 1px solid #312e81; }
  .status { padding: 8px 16px; background: #1f2937; border-bottom: 1px solid #2d3748; display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot-live { background: #00d4aa; animation: pulse 1.5s infinite; }
  .dot-off { background: #4b5563; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .empty { display: flex; align-items: center; justify-content: center; height: 100%; color: #4b5563; font-size: 16px; }
</style>
</head>
<body>

<div class="header">
  <h1><span>DataTap</span> Control</h1>
  <div class="stats-bar">
    <div>Events: <span class="val" id="totalCount">0</span></div>
    <div>EPS: <span class="val" id="currentEps">0</span></div>
    <div>Elapsed: <span class="val" id="elapsed">0s</span></div>
    <div>Sources: <span class="val" id="activeSources">-</span></div>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="section">
      <h3>Sourcetypes</h3>
      <div class="checks" id="sourcetypeList"></div>
    </div>

    <div class="section">
      <div class="field">
        <label>Events Per Second</label>
        <div class="range-row">
          <input type="range" id="epsSlider" min="1" max="500" value="10">
          <span class="range-val" id="epsVal">10</span>
        </div>
      </div>
      <div class="field">
        <label>Duration (seconds, 0 = infinite)</label>
        <input type="number" id="duration" value="0" min="0">
      </div>
    </div>

    <div class="section btn-group">
      <button class="btn btn-start" id="btnStart" onclick="startStream()">Start Stream</button>
      <button class="btn btn-stop" id="btnStop" onclick="stopStream()" disabled>Stop</button>
    </div>

    <div class="section">
      <h3>Scenarios</h3>
      <div class="field">
        <select id="scenarioSelect"></select>
      </div>
      <div class="field">
        <label>Time Scale (1 = realtime, 100 = 100x speed)</label>
        <div class="range-row">
          <input type="range" id="timeScale" min="1" max="500" value="50">
          <span class="range-val" id="tsVal">50</span>
        </div>
      </div>
      <button class="btn btn-scenario" id="btnScenario" onclick="startScenario()">Run Scenario</button>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;overflow:hidden;">
    <div class="status">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">Ready</span>
    </div>
    <div class="feed" id="feed">
      <div class="empty" id="emptyMsg">Select sourcetypes and click Start Stream</div>
    </div>
  </div>
</div>

<script>
const feed = document.getElementById('feed');
const emptyMsg = document.getElementById('emptyMsg');
let eventSource = null;
let running = false;
const MAX_EVENTS = 500;

// Load sourcetypes
fetch('/api/sourcetypes').then(r => r.json()).then(types => {
  const list = document.getElementById('sourcetypeList');
  types.forEach(t => {
    const id = typeof t === 'string' ? t : t.sourcetype;
    const desc = typeof t === 'string' ? '' : (t.description || '');
    const label = document.createElement('label');
    label.innerHTML = `<input type="checkbox" value="${id}" checked> ${id}`;
    if (desc) label.title = desc;
    list.appendChild(label);
  });
});

// Load scenarios
fetch('/api/scenarios').then(r => r.json()).then(scenarios => {
  const sel = document.getElementById('scenarioSelect');
  scenarios.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.name;
    opt.textContent = `${s.name} (${s.phaseCount} phases)`;
    sel.appendChild(opt);
  });
});

// EPS slider
const epsSlider = document.getElementById('epsSlider');
const epsVal = document.getElementById('epsVal');
epsSlider.oninput = () => epsVal.textContent = epsSlider.value;

// TimeScale slider
const tsSlider = document.getElementById('timeScale');
const tsVal = document.getElementById('tsVal');
tsSlider.oninput = () => tsVal.textContent = tsSlider.value;

function stClass(st) {
  if (st.includes('pan')) return 'st-pan';
  if (st.includes('syslog')) return 'st-syslog';
  if (st.includes('Win')) return 'st-win';
  if (st.includes('crowd')) return 'st-cs';
  if (st.includes('okta')) return 'st-okta';
  return '';
}

function connectSSE() {
  if (eventSource) eventSource.close();
  eventSource = new EventSource('/api/events');
  eventSource.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === 'event') {
      if (emptyMsg) emptyMsg.remove();
      const row = document.createElement('div');
      row.className = 'event-row';
      row.innerHTML = `<span class="event-num">${data.count}</span><span class="event-st ${stClass(data.sourcetype)}">${data.sourcetype}</span><span class="event-raw">${escHtml(data.raw)}</span>`;
      feed.appendChild(row);
      // Auto-scroll
      feed.scrollTop = feed.scrollHeight;
      // Trim old events
      while (feed.children.length > MAX_EVENTS) feed.removeChild(feed.firstChild);
      // Update stats
      document.getElementById('totalCount').textContent = data.count;
      if (data.elapsed) document.getElementById('elapsed').textContent = data.elapsed + 's';
    } else if (data.type === 'stats') {
      document.getElementById('totalCount').textContent = data.count || data.eventsGenerated || 0;
      if (data.elapsed) document.getElementById('elapsed').textContent = data.elapsed + 's';
      if (data.actualEPS !== undefined) document.getElementById('currentEps').textContent = data.actualEPS.toFixed(1);
    } else if (data.type === 'phase') {
      const row = document.createElement('div');
      row.className = 'phase-row';
      row.textContent = `Phase ${data.index + 1}/${data.total}: ${data.name}`;
      feed.appendChild(row);
      feed.scrollTop = feed.scrollHeight;
    } else if (data.type === 'stopped') {
      setRunning(false);
    }
  };
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function setRunning(val) {
  running = val;
  document.getElementById('btnStart').disabled = val;
  document.getElementById('btnScenario').disabled = val;
  document.getElementById('btnStop').disabled = !val;
  document.getElementById('statusDot').className = val ? 'dot dot-live' : 'dot dot-off';
  document.getElementById('statusText').textContent = val ? 'Streaming...' : 'Stopped';
}

function startStream() {
  const checks = document.querySelectorAll('#sourcetypeList input:checked');
  const sourcetypes = Array.from(checks).map(c => c.value);
  if (!sourcetypes.length) { alert('Select at least one sourcetype'); return; }
  const eps = parseInt(epsSlider.value);
  const duration = parseInt(document.getElementById('duration').value) || 0;

  feed.innerHTML = '';
  document.getElementById('totalCount').textContent = '0';
  document.getElementById('currentEps').textContent = eps;
  document.getElementById('activeSources').textContent = sourcetypes.length;

  connectSSE();
  fetch('/api/start', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sourcetypes, eps, duration }),
  });
  setRunning(true);
}

function startScenario() {
  const name = document.getElementById('scenarioSelect').value;
  const eps = parseInt(epsSlider.value);
  const timeScale = parseInt(tsSlider.value);

  feed.innerHTML = '';
  document.getElementById('totalCount').textContent = '0';
  document.getElementById('currentEps').textContent = eps;
  document.getElementById('activeSources').textContent = name;

  connectSSE();
  fetch('/api/scenario', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, eps, timeScale }),
  });
  setRunning(true);
}

function stopStream() {
  fetch('/api/stop', { method: 'POST' });
  setRunning(false);
  if (eventSource) { eventSource.close(); eventSource = null; }
}
</script>
</body>
</html>
