        function hx(n){var s="";for(var i=0;i<n;i++)s+="0123456789abcdef"[Math.floor(Math.random()*16)];return s}
        function uu(){return hx(8)+"-"+hx(4)+"-4"+hx(3)+"-"+pk(["8","9","a","b"])+hx(3)+"-"+hx(12)}
        var fns=["james","mary","robert","jennifer","david","sarah","michael","linda","kevin","nancy","carlos","sofia","wei","priya","omar","ali","yuki","ravi","fatima","elena"];
        var lns=["smith","johnson","williams","brown","jones","garcia","miller","davis","wilson","moore","martinez","lee","nguyen","patel","kim","chen","torres","wright","clark","lewis"];
        function nm(){return pk(fns)+"."+pk(lns)}
        function fts(){return new Date().toISOString().replace("T"," ").substring(0,19).replace(/-/g,"/")}
        function iso(){return new Date().toISOString()}
        function ser(){return "00725100"+String(ri(0,9999999)).padStart(7,"0")}
        function ep(){return ri(49152,65535)}
        function wp(){return pk([443,80,53,8080,22,25,3389,8443])}
        function genField(fld){var parts=fld.split(":");var n=parts[0];if(n==="ts")return iso();if(n==="src_ip"||n==="client_ip")return pip();if(n==="dst_ip"||n==="ip")return rip();if(n==="src_port")return ep();if(n==="dst_port"||n==="port")return wp();if(n==="user")return nm();if(n==="email")return nm()+"@contoso.com";if(n==="host")return pk(["SRV","WKS","APP","DB","FW"])+"-"+pk(["NYC","LAX","CHI","DFW","SEA"])+"-"+ri(1,9999);if(n==="domain")return pk(["contoso.com","acme.org","northwind.net","fabrikam.io"]);if(n==="ua")return "Mozilla/5.0 Chrome/"+ri(100,126)+".0."+ri(0,99)+"."+ri(0,9999);if(n==="uuid")return uu();if(n==="sha256")return hx(64);if(n==="md5")return hx(32);if(n==="sid"||n==="serial")return hx(16);if(parts.length>=2&&parts[1]==="i"&&parts[2]){var r=parts[2].split("-");return ri(parseInt(r[0])||0,parseInt(r[1])||65535)}if(parts.length>=2&&parts[1]==="f"&&parts[2]){var r2=parts[2].split("-");return Math.round((parseFloat(r2[0])+Math.random()*(parseFloat(r2[1])-parseFloat(r2[0])))*100)/100}if(parts.length>=2&&parts[1]==="s"&&parts[2])return pk(parts[2].split(","));if(parts.length>=2&&parts[1].indexOf(",")>=0)return pk(parts[1].split(","));if(parts.length>=2&&parts[1]==="s")return "";return ""}
        var st="pan:traffic";
        try{var t=JSON.parse(__e._raw);if(t&&t.sourcetype)st=t.sourcetype}catch(e){}
        var rules=["Allow-Web","Deny-All","Corp-Egress","VPN-Access","DMZ-Inbound","Block-Malware","Allow-DNS","SaaS-Allow","Guest-WiFi","Partner-VPN"];
        var apps=["ssl","web-browsing","dns","zoom","ms-teams","slack","ms-office365","github-base","ssh","ldap","smtp","salesforce"];
        var zones=["trust","untrust","dmz","vpn"];
        if(st==="pan:traffic"){__e._raw=fts()+","+ser()+",TRAFFIC,"+pk(["end","end","end","start","drop","deny"])+","+fts()+","+pip()+","+rip()+",198.51.100."+ri(1,254)+",10.10."+ri(0,255)+"."+ri(1,254)+","+pk(rules)+",corp\\\\"+nm()+",,"+pk(apps)+",vsys1,"+pk(zones)+","+pk(zones)+",ethernet1/"+ri(1,12)+",ethernet1/"+ri(1,12)+",Log-Forwarding-Default,"+ri(100000,9999999)+","+ri(1,12)+","+ep()+","+wp()+","+ep()+","+wp()+",0x400000,"+pk(["tcp","tcp","tcp","udp","icmp"])+","+pk(["allow","allow","allow","deny","drop"])+","+ri(60,524288)+","+ri(40,262144)+","+ri(40,262144)+","+ri(1,5000)+","+fts()+","+ri(0,3600)+","+pk(["general-internet","business-and-economy","streaming-media","cloud-infrastructure"])+","+ri(1,99999999)+",0x0,US,US,"+ri(1,2500)+","+ri(1,2500)+","+pk(["tcp-fin","tcp-rst-from-client","aged-out","threat","policy-deny"])}
        else if(st==="syslog"){var f=pk([0,1,3,4,10,13,16]);var sv=pk([3,4,5,6]);__e._raw="<"+(f*8+sv)+">1 "+iso()+" "+pk(["web-01","db-01","app-01","lb-01","fw-01","jump-01"])+" "+pk(["sshd","sudo","cron","systemd","nginx","postfix","kernel","auditd","docker"])+" "+ri(1000,65535)+" - - "+pk(["session opened for user "+nm(),"Accepted publickey for "+nm()+" from "+pip(),"Failed password for "+nm()+" from "+rip(),"process started","service restarted","connection from "+pip(),"disk usage at "+ri(40,98)+"%"])}
        else if(st==="WinEventLog:Security"){var eid=pk([4624,4625,4672,4688,4720,4740]);__e._raw="<Event xmlns=\"http://schemas.microsoft.com/win/2004/08/events/event\"><System><Provider Name=\"Microsoft-Windows-Security-Auditing\"/><EventID>"+eid+"</EventID><TimeCreated SystemTime=\""+iso()+"\"/><EventRecordID>"+ri(10000000,99999999)+"</EventRecordID><Computer>"+pk(["DC01","DC02","FS01","WKS-FIN-PC01","SRV-SQL01"])+".corp.contoso.com</Computer></System><EventData><Data Name=\"TargetUserName\">"+nm()+"</Data><Data Name=\"IpAddress\">"+pip()+"</Data><Data Name=\"LogonType\">"+pk([2,3,7,10])+"</Data></EventData></Event>"}
        else if(st==="crowdstrike:falcon:event"){var ev=pk(["ProcessRollup2","DnsRequest","NetworkConnectIP4","UserLogon","DetectionSummaryEvent"]);__e._raw=JSON.stringify({metadata:{customerIDString:hx(32),eventType:ev},event:{event_simpleName:ev,timestamp:Date.now(),aid:hx(32),ComputerName:pk(["WKS","SRV","LAP"])+"-"+pk(["NYC","LAX","CHI","SEA","DFW"])+"-"+ri(1,9999),UserName:nm(),SeverityName:pk(["Informational","Low","Medium","High","Critical"])}})}
        else if(st==="okta:system"){__e._raw=JSON.stringify({uuid:uu(),published:iso(),eventType:pk(["user.session.start","user.session.end","user.authentication.sso","user.authentication.auth_via_mfa","user.account.lock"]),actor:{id:"00u"+hx(14),type:"User",alternateId:nm()+"@contoso.com"},client:{ipAddress:rip(),device:pk(["Computer","Mobile","Tablet"]),geographicalContext:{city:pk(["New York","London","Tokyo","Sydney"]),country:pk(["US","GB","JP","AU"])}},outcome:{result:pk(["SUCCESS","SUCCESS","SUCCESS","FAILURE"])}})}
        else{var fields=st.split(":").join("_")+"_event";var obj={sourcetype:st,timestamp:iso(),src_ip:pip(),dst_ip:rip(),user:nm(),id:uu(),action:pk(["allow","deny","alert","block","detect","monitor","quarantine","isolate"]),severity:pk(["informational","low","medium","high","critical"]),status:pk(["success","failure","pending","active","resolved"]),host:pk(["SRV","WKS","APP","DB","FW","GW","LB","DNS"])+"-"+pk(["NYC","LAX","CHI","DFW","SEA","SFO","BOS","ATL","IAD","PDX"])+"-"+ri(1,9999),description:"Generated "+st+" event",category:pk(["security","authentication","network","system","application","compliance","audit","threat"]),bytes:ri(60,1048576),duration:ri(0,86400),session_id:hx(16),rule:pk(["default-allow","block-suspicious","monitor-all","alert-high","custom-policy-"+ri(1,99)])};__e._raw=JSON.stringify(obj)}
        __e._time=Date.now()/1000;
        __e.sourcetype=st;
        __e.source="datatap";
